<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA：可添加到手机主屏，像 App 一样全屏打开 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- 响应式视口：手机上按真实宽度渲染，Tailwind 的 sm:/md: 断点才会生效 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#111111" />
    <!-- iOS PWA：全屏体验 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vocabulary Agent" />
    <title>Vocabulary Agent</title>
    <style>
      /* 加载态：JS 还没跑起来时别让用户看到纯白 */
      #va-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f8fafc;
        color: #64748b;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }
      #va-boot .va-logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: #111827;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 22px;
      }
      #va-boot .va-spin {
        width: 18px;
        height: 18px;
        border: 2px solid #e2e8f0;
        border-top-color: #111827;
        border-radius: 50%;
        animation: va-spin 0.7s linear infinite;
      }
      @keyframes va-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #va-boot .va-tip {
        font-size: 12px;
        color: #94a3b8;
        max-width: 240px;
        text-align: center;
      }
    </style>
  </head>
  <body class="bg-ink-50 text-ink-900 font-sans antialiased">
    <div id="root">
      <div id="va-boot">
        <div class="va-logo">V</div>
        <div class="va-spin"></div>
        <div class="va-tip">正在加载…</div>
      </div>
    </div>

    <script>
      /*
       * 启动自愈
       *
       * 背景：如果手机缓存了旧版 index.html，而它引用的 /assets/index-xxxx.js
       * 已经在发版时被删掉，入口 JS 会 404，页面就一直空白。
       * 这里做两件事：
       *   1) 入口 JS 加载失败 → 立刻带 cache-busting 参数重载（绕过 HTTP 缓存）
       *   2) 3.5 秒还没挂载出来 → 同样重载一次
       * 只重试一次，避免无限循环。
       */
      (function () {
        window.__VA_BOOTED__ = false;
        var retried = false;

        function stillBlank() {
          if (window.__VA_BOOTED__) return false;
          var root = document.getElementById('root');
          // React 挂载后会清掉 #va-boot
          return !!(root && root.querySelector('#va-boot'));
        }

        function reload() {
          if (retried) return;
          retried = true;
          try {
            var u = new URL(location.href);
            if (u.searchParams.has('_r')) return; // 已经重试过，别再循环
            u.searchParams.set('_r', String(Date.now()));
            location.replace(u.toString());
          } catch (e) {
            location.reload();
          }
        }

        // 入口脚本加载失败（404 / 被拦截）
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target;
            if (t && t.tagName === 'SCRIPT' && stillBlank()) setTimeout(reload, 100);
          },
          true,
        );

        // 兜底超时
        setTimeout(function () {
          if (stillBlank()) reload();
        }, 3500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
