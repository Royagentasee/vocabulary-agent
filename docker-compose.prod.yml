# 生产部署配置
# 用法：docker compose -f docker-compose.prod.yml up -d --build
version: '3.9'

services:
  # AI 网关（FastAPI + DeepSeek）
  ai-gateway:
    build:
      context: .
      dockerfile: services/ai-gateway/Dockerfile
    restart: always
    environment:
      DATABASE_URL: sqlite:////data/vocab_agent.db
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      LLM_PROVIDER: deepseek
      USE_AI_MOCK: ${USE_AI_MOCK:-false}
    volumes:
      - vocab_data:/data
    expose:
      - "8000"

  # Web 前端（Nginx 托管静态文件 + 反代 API）
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - ai-gateway

volumes:
  vocab_data:
